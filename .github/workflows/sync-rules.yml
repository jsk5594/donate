# 운영 세칙 근거 법령·자료 월간 점검 — 매월 1일 09:00(KST)
# 바뀐 법령 조문을 data/law-articles.json 에 반영해 커밋하면, 연결된 배포(Vercel 등)가 새 조문으로 다시 배포됩니다.
# 세칙 본문 검토가 필요한 변경이 있으면 이슈를 엽니다.
name: 운영 세칙 근거 법령 월간 점검

on:
  schedule:
    - cron: "0 0 1 * *" # UTC 00:00 = KST 09:00
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 점검 스크립트는 외부 패키지 없이 동작(세칙 목록은 src/lib/rules-content.ts 를 그대로 읽음)
      - name: 근거 법령·자료 점검
        id: sync
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/sync-rules.mjs | tee sync.log
          if grep -q '^CHANGED$' sync.log; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: 변경분 커밋
        run: |
          git config user.name "rules-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/law-articles.json data/rules-sync.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "운영 세칙 근거 법령 월간 점검 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
      - name: 세칙 검토 이슈 열기
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "월간 점검에서 운영 세칙의 근거가 바뀐 것을 확인했습니다."
            echo
            echo '```'
            sed -n '/^점검 완료/,/^CHANGED$/p' sync.log
            echo '```'
            echo
            echo "- 법령 원문(세칙 상세의 '관련 법령 원문', AI 기부 도우미 근거)은 이미 새 조문으로 바뀌었습니다."
            echo "- 세칙 본문(src/lib/rules-content.ts)과 판정 기준(src/lib/rules.ts)을 검토해 고친 뒤, data/rules-sync.json 의 해당 항목 reviewed 를 true 로 바꿔 주세요."
          } > issue.md
          gh issue create --title "운영 세칙 검토 필요: 근거 법령·자료 변경 ($(TZ=Asia/Seoul date +%Y-%m-%d))" --body-file issue.md
